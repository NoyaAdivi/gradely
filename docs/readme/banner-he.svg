<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Gradely">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="320" rx="32"/></clipPath><path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.rise{animation:rise .9s ease-out both}.r2{animation-delay:.2s}
.ring{stroke-dasharray:0 400;animation:fill 2.4s ease-out forwards}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fill{to{stroke-dasharray:250 400}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{stroke-dasharray:250 400}}
</style><g clip-path="url(#c)"><rect width="1200" height="320" fill="url(#bg)"/><circle class="blob" cx="150" cy="300" r="130" fill="#FFB4A2" opacity=".32"/><circle class="blob b2" cx="760" cy="30" r="150" fill="#CFC8FF" opacity=".5"/><circle class="blob b3" cx="1120" cy="270" r="140" fill="#A9E3CD" opacity=".45"/><g transform="translate(60 40)"><g class="bob"><circle cx="160" cy="120" r="92" fill="none" stroke="#fff" stroke-width="22"/>
<circle class="ring" cx="160" cy="120" r="92" fill="none" stroke="url(#t)" stroke-width="22" stroke-linecap="round" transform="rotate(-90 160 120)"/>
<text x="160" y="132" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="#2B2140">92.4</text></g>
<g transform="translate(10 0)"><g class="bob d2"><clipPath id="lg"><rect width="84" height="84" rx="22"/></clipPath><image clip-path="url(#lg)" href="data:image/svg+xml;base64," width="84" height="84"/></g></g>
<use class="tw" href="#s" x="300" y="30" fill="#FFB4A2"/><use class="tw t2" href="#s" x="20" y="200" fill="#A9E3CD"/><use class="tw t3" href="#s" x="300" y="220" fill="#B3A9FA"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end"><text class="rise" x="1128" y="150" font-size="104" font-weight="800" fill="url(#t)">Gradely</text>
<text class="rise r2" x="1124" y="208" font-size="30" font-weight="700" fill="#2B2140">מחשבון ממוצע תואר, יפה וחכם</text>
<text class="rise r2" x="1124" y="250" font-size="23" fill="#7A6B88">ממוצע משוקלל · סמסטרים · יעדים · עברית ואנגלית</text></g></g></svg>
