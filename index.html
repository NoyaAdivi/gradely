<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gradely · מחשבון ממוצע תואר</title>
  <meta name="description" content="Gradely: a bilingual, credit-weighted degree GPA calculator">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="application-name" content="Gradely">
  <meta name="apple-mobile-web-app-title" content="Gradely">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#FFF4EF">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('noya-kit:theme'));if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>.built-by{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.45em;margin:.6em 0;font-weight:600}.built-by a{display:inline-flex;align-items:center;gap:.4em;padding:.28em .8em;border-radius:999px;font-weight:800;text-decoration:none;color:inherit;background:rgba(10,102,194,.1);transition:transform .25s ease,background .25s ease,box-shadow .25s ease}.built-by a:hover,.built-by a:focus-visible{transform:translateY(-2px);background:rgba(10,102,194,.18);box-shadow:0 6px 16px rgba(10,102,194,.18)}.built-by svg{width:1.1em;height:1.1em;fill:#0A66C2;flex:none;transition:transform .35s ease}.built-by a:hover svg{transform:rotate(-8deg) scale(1.12)}html[lang="he"] .built-by .bb-en,html:not([lang="he"]) .built-by .bb-he{display:none}@media (prefers-reduced-motion:reduce){.built-by a,.built-by svg{transition:none}}</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span><span class="spark s4">✦</span>
  </div>

  <nav class="top">
    <a class="brand" href="#" id="brand"><img src="logo.svg" alt="Gradely"><span>Gradely</span></a>
    <div class="actions">
      <button class="chip" id="themeBtn" type="button" data-nk-theme><span data-nk-icon>🌙</span></button>
      <button class="chip lang" id="langBtn">EN</button>
    </div>
  </nav>

  <main class="wrap">
    <header class="hero">
      <div class="hero-badge" aria-hidden="true"><img src="logo.svg" alt=""><span class="orbit"><i></i><i></i><i></i></span></div>
      <h1><span class="grad" data-i18n="title"></span></h1>
      <p class="sub" data-i18n="subtitle"></p>
      <div class="pills"><a href="#dash" data-i18n="pill1"></a><a href="#target" data-i18n="pill2"></a><a href="#boost" data-i18n="pill3"></a><a href="#faq" data-i18n="pill4"></a></div>
    </header>

    <section class="dash reveal" id="dash">
      <div class="card ring-card">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="52" class="track"/>
          <circle cx="60" cy="60" r="52" class="bar" id="ringBar"/>
        </svg>
        <div class="ring-text">
          <span class="big" id="avg">0.00</span>
          <span class="label" data-i18n="avg"></span>
        </div>
      </div>

      <div class="mini-grid">
        <div class="card mini peach"><span class="label" data-i18n="credits"></span><span class="num" id="credits">0</span></div>
        <div class="card mini lilac"><span class="label" data-i18n="courses"></span><span class="num" id="count">0</span></div>
        <div class="card mini mint wide">
          <div class="row-between">
            <span class="label" data-i18n="progress"></span>
            <label class="inline"><span data-i18n="ofTotal"></span><input type="number" id="degreeCredits" min="0" step="0.5" placeholder="120"></label>
          </div>
          <div class="pbar"><span id="pfill"></span></div>
          <span class="hint" id="ptext"></span>
        </div>
      </div>
    </section>

    <section class="layout reveal">
      <div>
        <div class="demo card" id="demoBox"><span>👋</span><p data-i18n="demoQ"></p><button class="btn soft" id="demoBtn" data-i18n="demoBtn"></button></div>
        <div class="scan" id="scanBox">
          <span class="scan-spark k1" aria-hidden="true">✦</span><span class="scan-spark k2" aria-hidden="true">✦</span><span class="scan-spark k3" aria-hidden="true">✦</span>
          <div class="scan-top">
            <div class="scan-logo" aria-hidden="true"><img src="logo.svg" alt=""></div>
            <div>
              <span class="scan-new" data-i18n="scNew">✨ חדש</span>
              <h3 data-i18n="scT">יש לך גיליון ציונים? הציונים ימולאו לבד</h3>
              <p data-i18n="scD">בוחרים איך להכניס את הציונים: מעלים קובץ, מצלמים את הגיליון או מקלידים. לפני השמירה תוכלו לבדוק ולתקן הכל</p>
            </div>
          </div>
          <div class="scan-btns">
            <button class="scan-opt o1" id="scanBtn" type="button">
              <span class="ill ill-doc" aria-hidden="true"><svg viewBox="0 0 74 74"><rect x="16" y="8" width="38" height="50" rx="7" fill="#fff" stroke="#E8846F" stroke-width="2.5"/><path d="M24 20h22M24 28h22M24 36h14" stroke="#F6B9A8" stroke-width="3" stroke-linecap="round"/><rect class="beam" x="19" y="14" width="32" height="3" rx="1.5" fill="#B3A9FA"/><circle cx="52" cy="54" r="12" fill="#E8846F"/><path class="up" d="M52 60v-11M47 53l5-5 5 5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <b data-i18n="scBtn">העלאת מסמך</b><small data-i18n="scBtnS">PDF, Word, Excel או תמונה</small><span class="go" data-i18n="scGo1">בחירת קובץ</span>
            </button>
            <button class="scan-opt o2" id="scanCam" type="button">
              <span class="ill ill-cam" aria-hidden="true"><svg viewBox="0 0 74 74"><rect x="10" y="22" width="54" height="38" rx="10" fill="#fff" stroke="#7B6DF2" stroke-width="2.5"/><path d="M26 22l4-7h14l4 7" fill="#E8E4FF" stroke="#7B6DF2" stroke-width="2.5" stroke-linejoin="round"/><circle cx="37" cy="42" r="11" fill="#E8E4FF" stroke="#7B6DF2" stroke-width="2.5"/><g class="lens"><circle cx="37" cy="42" r="6" fill="#7B6DF2"/><circle cx="34.5" cy="39.5" r="2" fill="#fff"/></g><g class="flash"><path d="M56 12v16M48 20h16M50.5 14.5l11 11M61.5 14.5l-11 11" stroke="#F2C14E" stroke-width="2.4" stroke-linecap="round"/></g></svg></span>
              <b data-i18n="scCam">צילום הגיליון</b><small data-i18n="scCamS">מצלמים במצלמה של הטלפון</small><span class="go" data-i18n="scGo2">פתיחת מצלמה</span>
            </button>
            <button class="scan-opt o3" id="scanPaste" type="button">
              <span class="ill ill-pen" aria-hidden="true"><svg viewBox="0 0 74 74"><rect x="10" y="12" width="46" height="50" rx="8" fill="#fff" stroke="#3FA57B" stroke-width="2.5"/><path class="ln l1" d="M18 30h30" stroke="#8FD6B6" stroke-width="3" stroke-linecap="round"/><path class="ln l2" d="M18 42h30" stroke="#8FD6B6" stroke-width="3" stroke-linecap="round"/><g class="pen"><path d="M50 46l14-14 5 5-14 14-7 2z" fill="#3FA57B"/><path d="M48 53l2-7 5 5z" fill="#F6B9A8"/></g></svg></span>
              <b data-i18n="scPaste">הקלדה ידנית</b><small data-i18n="scPasteS">או הדבקת טקסט מהפורטל</small><span class="go" data-i18n="scGo3">התחלה</span>
            </button>
          </div>
          <p class="scan-drop" data-i18n="scDrop">💡 אפשר גם לגרור קובץ לכאן או להדביק צילום מסך עם Ctrl+V</p>
          <input type="file" id="scanFile" accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.txt" hidden>
          <input type="file" id="scanCamFile" accept="image/*" capture="environment" hidden>
        </div>
        <div id="semesters"></div>
        <button class="btn primary" id="addSem"><span>＋</span> <b data-i18n="addSem"></b></button>
      </div>

      <aside>
        <div class="card side" id="target">
          <h2 data-i18n="targetT"></h2>
          <div class="fields">
            <label><span data-i18n="targetAvg"></span><input type="number" id="tAvg" min="0" step="0.1" placeholder="90"></label>
            <label><span data-i18n="left"></span><input type="number" id="tLeft" min="0" step="0.5" placeholder="40"></label>
          </div>
          <p class="result" id="tResult"></p>
        </div>

        <div class="card side">
          <h2 data-i18n="chartT"></h2>
          <div id="chart" class="chart"></div>
        </div>

        <div class="card side">
          <h2 data-i18n="settings"></h2>
          <label class="inline full"><span data-i18n="scale"></span>
            <select id="scale">
              <option value="100">0 - 100</option>
              <option value="4">0 - 4.0</option>
              <option value="5">0 - 5.0</option>
              <option value="10">0 - 10</option>
              <option value="20">0 - 20</option>
            </select>
          </label>
          <p class="hint backup-hint" data-i18n="backupHint"></p>
          <div class="row2">
            <button class="btn ghost" id="exportBtn" data-i18n-title="exportT">⬇ <b data-i18n="export"></b></button>
            <button class="btn ghost" id="importBtn" data-i18n-title="importT">⬆ <b data-i18n="import"></b></button>
          </div>
          <div class="row2">
            <button class="btn ghost" id="shareBtn" data-i18n-title="shareT">🔗 <b data-i18n="share"></b></button>
            <button class="btn ghost" id="printBtn" data-i18n-title="printT">🖨 <b data-i18n="print"></b></button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
          <button class="btn ghost" id="demoBtn2" data-i18n="demoBtn"></button>
          <button class="btn ghost danger" id="resetBtn" data-i18n="reset"></button>
        </div>
      </aside>
    </section>

    <section class="card boost reveal" id="boost">
      <div class="boost-head">
        <div>
          <h2 data-i18n="bT"></h2>
          <p class="hint" data-i18n="bSub"></p>
        </div>
        <div class="boost-now">
          <div><span class="label" data-i18n="bNow"></span><b id="bNow">0</b></div>
          <span class="arrow">➜</span>
          <div><span class="label" data-i18n="bGoalL"></span><b id="bGoal" class="goal">0</b></div>
        </div>
      </div>

      <div class="boost-ctrl">
        <label class="inline"><span data-i18n="bBy"></span><input type="number" id="bX" min="0" step="any" placeholder="2"></label>
        <div class="quick" id="bQuick"></div>
      </div>
      <details class="real">
        <summary data-i18n="bReal"></summary>
        <div class="fields">
          <label><span data-i18n="bCap"></span><input type="number" id="bCap" min="0" step="any"></label>
          <label><span data-i18n="bJump"></span><input type="number" id="bJump" min="0" step="any"></label>
        </div>
      </details>

      <div class="tabs" id="bTabs" role="tablist">
        <button class="tab" data-tab="plans" role="tab"><span>💡</span> <b data-i18n="tabPlans"></b></button>
        <button class="tab" data-tab="pick" role="tab"><span>🎯</span> <b data-i18n="tabPick"></b></button>
        <button class="tab" data-tab="whatif" role="tab"><span>🔮</span> <b data-i18n="tabWhat"></b></button>
        <button class="tab" data-tab="impact" role="tab"><span>⚡</span> <b data-i18n="tabImpact"></b></button>
      </div>
      <div class="pane" id="bPane" aria-live="polite"></div>
    </section>

    <footer>
      <p data-i18n="saved"></p>
      <p class="links">
        <a href="https://github.com/NoyaAdivi/gradely" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://noyaadivi.github.io/noya-website" target="_blank" rel="noopener" data-i18n="portfolio"></a>
      </p>
      <p class="built-by"><span class="bb-en">Built by</span><span class="bb-he">נבנה על ידי</span> <a href="https://www.linkedin.com/in/noya-adivi/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.73V1.73C24 .77 23.21 0 22.23 0z"/></svg><span class="bb-en">Noya Adivi</span><span class="bb-he">נויה אדיבי</span></a></p>
    </footer>
  </main>

  <div class="toast" id="toast"></div>
  <div class="scan-modal" id="scanModal" hidden><div class="scan-sheet card" role="dialog" aria-modal="true" id="scanSheet"></div></div>

  <dialog class="card paste-dlg" id="pasteDlg">
    <form method="dialog">
      <h2 data-i18n="pasteH"></h2>
      <p class="hint" data-i18n="pasteHint"></p>
      <textarea id="pasteTxt" rows="7" dir="auto"></textarea>
      <p class="hint" id="pastePrev"></p>
      <div class="row2">
        <button class="btn ghost" value="cancel" data-i18n="cancel"></button>
        <button class="btn primary" value="ok" id="pasteOk"><b data-i18n="pasteAdd"></b></button>
      </div>
    </form>
  </dialog>

  <template id="semTpl">
    <section class="card sem">
      <div class="sem-head">
        <button class="fold" aria-label="toggle">▾</button>
        <input type="text" class="sem-name">
        <span class="sem-avg"></span>
        <button class="icon paste" data-i18n-title="pasteT">📋</button>
        <button class="icon del-sem" data-i18n-title="delSem">🗑</button>
      </div>
      <div class="sem-body">
        <div class="crow head"><span data-i18n="course"></span><span data-i18n="cr"></span><span data-i18n="grade"></span><span data-i18n="inAvg"></span><span></span></div>
        <div class="courses"></div>
        <button class="btn soft add-course"><span>＋</span> <b data-i18n="addCourse"></b></button>
      </div>
    </section>
  </template>

  <template id="courseTpl">
    <div class="crow">
      <input type="text" class="name">
      <input type="number" class="cr" min="0" step="0.5" placeholder="4">
      <input type="number" class="gr" min="0" step="any" placeholder="90">
      <label class="toggle"><input type="checkbox" class="inc"><span></span></label>
      <button class="icon del">✕</button>
    </div>
  </template>

  <script src="app.js"></script>
  <script src="scan.js"></script>
  <script src="noya-kit.js" defer></script>
  <script src="faq.js" defer></script>
  <script src="noya-app.js" data-sw="sw.js" data-repo="https://github.com/NoyaAdivi/gradely" defer></script>
<script src="fx.js" data-burst=".btn.primary" defer></script>
</body>
</html>
